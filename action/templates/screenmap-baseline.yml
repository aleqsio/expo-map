# .github/workflows/screenmap-baseline.yml — keep the map of main fresh, and
# turn agent discoveries into committed flows
name: screenmap · baseline
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1-5"   # weekday mornings, in case main was quiet
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild the whole map instead of incrementally
        type: boolean
        default: false
concurrency:
  group: screenmap-baseline
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
  actions: write         # re-run PRs that were waiting for this map
jobs:
  baseline:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: aleqsio/screenmap@v1
        with:
          mode: baseline
          agent_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # agent_provider: claude   # or codex | gemini | opencode — pass the matching key above
          expo_token: ${{ secrets.EXPO_TOKEN }}   # EAS builds/serves the dev client (or pass app_path instead)
          flows_pr: "true"
