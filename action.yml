# Marketplace metadata: must live at the repo root; "appmap" alone would
# collide with AppLand's AppMap listing, hence the repo-matching name.
name: expo-map
description: >-
  Map every screen of an Expo / React Native app and review what a pull request changes on-screen.
  PR runs diff the head against a cached baseline map, capture only the affected screens on an iOS
  simulator, and post a sticky comment linking a preloaded visualiser. Baseline runs refresh the map
  of main incrementally and open a flows PR for screens the agent had to explore.
author: aleqsio
branding:
  icon: map
  color: blue

inputs:
  mode:
    description: "pr | baseline"
    required: true
  project:
    description: Path to the Expo project (repo-relative)
    default: "."
  agent_provider:
    description: "Agent CLI for screens with no committed flow: claude (default) | codex | gemini | opencode. Or set agent.command in .appmap/config.json to run any CLI."
    default: ""
  agent_api_key:
    description: API key for the chosen agent provider (mapped to the env var it expects). Leave empty for deterministic-only runs.
    default: ""
  agent_max_screens:
    description: Cap on screens the agent may explore per run
    default: "8"
  appmaps_branch:
    description: Orphan branch that stores baseline maps and per-PR change bundles
    default: appmaps
  publish:
    description: "Publish bundles to the appmaps branch so the comment can deep-link the hosted visualiser (requires contents: write). Set false for private repos if you only want the artifact."
    default: "true"
  viewer_url:
    description: Hosted visualiser origin used in comment links
    default: https://appmap-visualiser.vercel.app
  simulator:
    description: Simulator device name to boot
    default: iPhone 16 Pro
  xcode_configuration:
    description: Xcode configuration for the dev client build
    default: Debug
  xcode:
    description: "Xcode to build with: latest (newest installed — recent RN needs a newer Swift than the runner default), system (leave untouched), or a version like 26.3"
    default: latest
  build_cache_key_files:
    description: Globs hashed into the dev-client build cache key (JS-only changes must NOT bust it)
    default: "ios/**/*.pbxproj,ios/Podfile.lock,package.json,app.json,app.config.*"
  flows_pr:
    description: "(baseline) Open a PR against the default branch with flows the agent recorded"
    default: "true"
  github_token:
    description: Token for comments, appmaps-branch pushes and flows PRs
    default: ${{ github.token }}

outputs:
  bundle:
    description: Path of the produced .appmap / .appmapdiff
    value: ${{ steps.run.outputs.bundle }}
  summary:
    description: Path of the run summary JSON
    value: ${{ steps.run.outputs.summary }}
  viewer_link:
    description: Preloaded visualiser link (when published)
    value: ${{ steps.publish.outputs.viewer_link }}

runs:
  using: composite
  steps:
    - name: Check runner
      shell: bash
      env:
        INPUT_XCODE: ${{ inputs.xcode }}
      run: |
        if [ "$(uname)" != "Darwin" ]; then echo "::error::appmap needs a macOS runner (iOS simulator)"; exit 1; fi
        # the runner's default Xcode often lags what current RN's Swift packages need
        case "$INPUT_XCODE" in
          system) ;;
          latest) sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer" ;;
          *) sudo xcode-select -s "/Applications/Xcode_${INPUT_XCODE}.app/Contents/Developer" ;;
        esac
        xcodebuild -version
        xcrun simctl list devices available | head -20

    - name: Install appmap-ci
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        cd "$ACTION_PATH/action/cli" && npm ci --silent || npm install --silent
        echo "$ACTION_PATH/action/cli" >> "$GITHUB_PATH"
        ln -sfn "$ACTION_PATH/action/cli/appmap-ci.mjs" "$ACTION_PATH/action/cli/appmap-ci"
        npm install -g @swmansion/argent@0.21.0 --silent   # headless flow replay

    - name: Install project dependencies
      shell: bash
      working-directory: ${{ inputs.project }}
      run: |
        if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
        elif [ -f yarn.lock ]; then yarn install --frozen-lockfile
        else npm ci; fi

    - name: Compute dev-client cache key
      id: key
      shell: bash
      working-directory: ${{ inputs.project }}
      run: |
        IFS=',' read -ra GLOBS <<< "${{ inputs.build_cache_key_files }}"
        files=$(for g in "${GLOBS[@]}"; do compgen -G "$g" || true; done | sort -u)
        hash=$( (echo "${{ inputs.xcode_configuration }}"; xcodebuild -version; for f in $files; do [ -f "$f" ] && shasum -a 256 "$f"; done) | shasum -a 256 | cut -c1-16)
        echo "key=appmap-devclient-${{ runner.os }}-$hash" >> "$GITHUB_OUTPUT"

    - name: Restore dev client
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ inputs.project }}/ios/build/Build/Products
        key: ${{ steps.key.outputs.key }}

    - name: Boot simulator
      shell: bash
      run: |
        udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ds=[x for v in d.values() for x in v]; m=[x for x in ds if x["name"]=="${{ inputs.simulator }}"] or [x for x in ds if "iPhone" in x["name"]]; print(m[0]["udid"])')
        xcrun simctl boot "$udid" || true
        xcrun simctl bootstatus "$udid" -b
        echo "SIM_UDID=$udid" >> "$GITHUB_ENV"

    - name: Build dev client (cache miss)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.project }}
      run: |
        # no --no-install: fresh CNG checkouts have no ios/ yet, and expo must run pod install after prebuild
        set +e
        npx expo run:ios --no-bundler --configuration ${{ inputs.xcode_configuration }} --device "${{ inputs.simulator }}" > /tmp/expo-build.log 2>&1
        code=$?
        if [ $code -ne 0 ]; then
          echo "::group::build errors"; grep -n -m 20 -A 10 -E "error:|fatal|CommandError" /tmp/expo-build.log | head -250 || true; echo "::endgroup::"
        else
          tail -30 /tmp/expo-build.log
        fi
        exit $code

    - name: Upload build log (failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: appmap-build-log-${{ github.run_id }}
        path: /tmp/expo-build.log
        retention-days: 7
        if-no-files-found: ignore

    - name: Restore baseline map
      id: baseline
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        INPUT_APPMAPS_BRANCH: ${{ inputs.appmaps_branch }}
      run: |
        set -e
        mkdir -p .appmap-ci
        # prefer the baseline published for the PR base SHA; fall back to latest
        base_sha="$PR_BASE_SHA"
        branch="$INPUT_APPMAPS_BRANCH"
        if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
          git fetch --depth 1 origin "$branch":refs/remotes/origin/"$branch"
          pick=""
          [ -n "$base_sha" ] && pick=$(git ls-tree --name-only -r origin/$branch | grep "^main/${base_sha:0:7}" | head -1 || true)
          [ -z "$pick" ] && pick=$(git ls-tree --name-only -r origin/$branch | grep '^main/latest.appmap$' | head -1 || true)
          if [ -n "$pick" ]; then git show "origin/$branch:$pick" > .appmap-ci/baseline.appmap; echo "found=true" >> "$GITHUB_OUTPUT"; echo "baseline: $pick"; fi
        fi
        [ -f .appmap-ci/baseline.appmap ] || echo "found=false" >> "$GITHUB_OUTPUT"

    - name: Run appmap-ci
      id: run
      shell: bash
      env:
        AGENT_PROVIDER: ${{ inputs.agent_provider }}
        AGENT_MAX_SCREENS: ${{ inputs.agent_max_screens }}
        AGENT_API_KEY: ${{ inputs.agent_api_key }}
        GH_TOKEN: ${{ inputs.github_token }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_HTML_URL: ${{ github.event.pull_request.html_url }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_APPMAPS_BRANCH: ${{ inputs.appmaps_branch }}
        BASELINE_FOUND: ${{ steps.baseline.outputs.found }}
      run: |
        set -e
        # install the chosen agent CLI on demand; a custom agent.command must be preinstalled by the workflow
        if [ -n "$AGENT_API_KEY$AGENT_PROVIDER" ]; then
          case "${AGENT_PROVIDER:-claude}" in
            claude)   bin=claude;   pkg=@anthropic-ai/claude-code ;;
            codex)    bin=codex;    pkg=@openai/codex ;;
            gemini)   bin=gemini;   pkg=@google/gemini-cli ;;
            opencode) bin=opencode; pkg=opencode-ai ;;
            *)        bin=""; pkg="" ;;
          esac
          if [ -n "$bin" ] && ! command -v "$bin" >/dev/null; then npm install -g "$pkg" --silent; fi
        fi
        proj="$INPUT_PROJECT"
        mkdir -p "$proj/.appmap" && [ -f "$proj/.appmap/config.json" ] || true
        if [ "$INPUT_MODE" = "pr" ]; then
          if [ "$BASELINE_FOUND" != "true" ]; then
            echo "::warning::no baseline map found on $INPUT_APPMAPS_BRANCH — run the baseline workflow on main first; building a one-off baseline of the base commit is not supported yet"
            echo "bundle=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --depth 1 origin "$PR_BASE_SHA" || true
          appmap-ci pr --project "$proj" --baseline .appmap-ci/baseline.appmap \
            --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" \
            --pr "$PR_NUMBER" --title "$PR_TITLE" --url "$PR_HTML_URL" \
            --base-ref "$PR_BASE_REF" --head-ref "$PR_HEAD_REF" > .appmap-ci/summary.json
        else
          appmap-ci baseline --project "$proj" $( [ "$BASELINE_FOUND" = "true" ] && echo "--previous .appmap-ci/baseline.appmap" ) > .appmap-ci/summary.json
        fi
        bundle=$(python3 -c 'import json;print(json.load(open(".appmap-ci/summary.json"))["bundle"])')
        echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
        echo "summary=.appmap-ci/summary.json" >> "$GITHUB_OUTPUT"

    - name: Upload artifact
      if: steps.run.outputs.bundle != ''
      uses: actions/upload-artifact@v4
      with:
        name: appmap-${{ inputs.mode }}-${{ github.run_id }}
        path: |
          ${{ steps.run.outputs.bundle }}
          .appmap-ci/summary.json
        retention-days: 90

    - name: Publish to appmaps branch
      id: publish
      if: steps.run.outputs.bundle != '' && inputs.publish == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        GITHUB_SHA_CTX: ${{ github.sha }}
        GITHUB_REPO: ${{ github.repository }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_APPMAPS_BRANCH: ${{ inputs.appmaps_branch }}
        INPUT_VIEWER_URL: ${{ inputs.viewer_url }}
        RUN_BUNDLE: ${{ steps.run.outputs.bundle }}
      run: |
        set -e
        bundle="$RUN_BUNDLE"
        if [ "$INPUT_MODE" = "pr" ]; then
          dest="pr-${PR_NUMBER}/${PR_HEAD_SHA}.appmapdiff"
          out=$(appmap-ci publish --repo "$GITHUB_REPO" --branch "$INPUT_APPMAPS_BRANCH" --files "$bundle=$dest" --message "pr #${PR_NUMBER} @ ${PR_HEAD_SHA}")
          changes_url=$(echo "$out" | python3 -c "import json,sys;print(json.load(sys.stdin)['urls']['$dest'])")
          # the baseline this diff was computed against, so the viewer gets the backdrop
          base_sha="$PR_BASE_SHA"
          map_url="https://raw.githubusercontent.com/$GITHUB_REPO/$(git rev-parse origin/$INPUT_APPMAPS_BRANCH)/main/${base_sha:0:7}.appmap"
          git ls-tree --name-only -r "origin/$INPUT_APPMAPS_BRANCH" | grep -q "^main/${base_sha:0:7}.appmap$" || map_url="https://raw.githubusercontent.com/$GITHUB_REPO/$(git rev-parse origin/$INPUT_APPMAPS_BRANCH)/main/latest.appmap"
          echo "changes_url=$changes_url" >> "$GITHUB_OUTPUT"; echo "map_url=$map_url" >> "$GITHUB_OUTPUT"
          echo "viewer_link=${INPUT_VIEWER_URL}/?map=$map_url&changes=$changes_url" >> "$GITHUB_OUTPUT"
        else
          sha="$GITHUB_SHA_CTX"
          appmap-ci publish --repo "$GITHUB_REPO" --branch "$INPUT_APPMAPS_BRANCH" --files "$bundle=main/${sha:0:7}.appmap,$bundle=main/latest.appmap" --message "baseline @ $sha" >/dev/null
          echo "viewer_link=${INPUT_VIEWER_URL}/?map=https://raw.githubusercontent.com/$GITHUB_REPO/$(git rev-parse origin/$INPUT_APPMAPS_BRANCH)/main/latest.appmap" >> "$GITHUB_OUTPUT"
        fi

    - name: Comment on PR
      if: inputs.mode == 'pr' && steps.run.outputs.bundle != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_SERVER_URL_CTX: ${{ github.server_url }}
        GITHUB_REPO: ${{ github.repository }}
        GITHUB_RUN_ID_CTX: ${{ github.run_id }}
        VIEWER_URL: ${{ inputs.viewer_url }}
        PUBLISH_MAP_URL: ${{ steps.publish.outputs.map_url }}
        PUBLISH_CHANGES_URL: ${{ steps.publish.outputs.changes_url }}
      run: |
        artifact_url="${GITHUB_SERVER_URL_CTX}/${GITHUB_REPO}/actions/runs/${GITHUB_RUN_ID_CTX}#artifacts"
        appmap-ci comment --summary .appmap-ci/summary.json --post --repo "$GITHUB_REPO" --pr "$PR_NUMBER" \
          --viewer "$VIEWER_URL" --artifact-url "$artifact_url" \
          $( [ -n "$PUBLISH_MAP_URL" ] && echo --map-url "$PUBLISH_MAP_URL" ) \
          $( [ -n "$PUBLISH_CHANGES_URL" ] && echo --changes-url "$PUBLISH_CHANGES_URL" )

    - name: Open flows PR
      if: inputs.mode == 'baseline' && inputs.flows_pr == 'true' && steps.run.outputs.bundle != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        GITHUB_REPO: ${{ github.repository }}
      run: |
        dir=$(python3 -c 'import json;print(json.load(open(".appmap-ci/summary.json")).get("recordedFlowsDir") or "")')
        if [ -n "$dir" ]; then
          appmap-ci flows-pr --repo "$GITHUB_REPO" --flows "$dir" --base "$REPO_DEFAULT_BRANCH" \
            --title "appmap: record flows for new screens" \
            --body "Flows recorded by the appmap agent during the baseline refresh for screens that had no committed flow. Review the taps, then merge — future runs replay them deterministically (no LLM)."
        else echo "no new flows recorded"; fi
